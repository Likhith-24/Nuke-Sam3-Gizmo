# H2_SamViT_Gizmo — ML environment definition, managed by uv.
#
# This is NOT an installable package; it only declares the dependency set that
# install.py provisions into ./venv, which env_bootstrap.py injects into Nuke's
# sys.path at startup. Commit uv.lock next to this file for byte-identical
# installs across every machine (run `python install.py` once, then commit the
# generated uv.lock).
#
# CUDA: torch/torchvision are pinned to the CUDA 12.6 wheel index below. To
# target a different CUDA build, change the index url + name (e.g. cu128) in
# BOTH places and re-run `uv lock`.

[project]
name = "h2-samvit-env"
version = "0"
requires-python = "==3.11.*"          # must match Nuke 16's embedded Python

dependencies = [
    # build backend — must be present to build sam2/sam3 without isolation
    "setuptools>=70",
    "wheel",
    # deep learning
    "torch>=2.0",
    "torchvision>=0.15",
    # ML / CV stack
    "transformers>=4.30",
    "opencv-python-headless>=4.8",    # headless avoids Qt clashes with Nuke
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.5",
    "psutil>=5.9",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "iopath>=0.1.10",
    "einops>=0.8",
    "decord>=0.6",
    "pycocotools>=2.0",
    "timm>=1.0",
    "ftfy>=6.1",
    # SAM models
    "sam2>=1.0",
    "sam3",
    # sam3 imports `triton` at import time. Linux uses upstream triton; Windows
    # has no official triton wheels, so use the community fork (drop-in `triton`
    # module). torch>=2.7 pairs with triton>=3.3 per triton-windows' matrix.
    "triton>=3.3 ; sys_platform == 'linux'",
    "triton-windows>=3.3 ; sys_platform == 'win32'",
]

[tool.uv]
# Dependency-only project: don't try to build/install this folder itself.
package = false

# sam2/sam3 build from source (sam3 is git-only) but don't declare their build
# backend, so uv's isolated build environment lacks setuptools. Inject it (and
# wheel) here so their metadata/wheel builds succeed — this is why we do NOT set
# no-build-isolation for them: that would remove the build env this feeds into.
# torch is intentionally omitted so their optional CUDA extension is skipped
# (it needs nvcc, which most artist boxes don't have).
[tool.uv.extra-build-dependencies]
sam2 = ["setuptools>=70", "wheel"]
sam3 = ["setuptools>=70", "wheel"]

# Pin torch/torchvision to the CUDA 12.6 wheel index for a reproducible install.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true                       # only used by packages that opt in below

[tool.uv.sources]
# CUDA wheels only exist for Windows/Linux; let macOS fall back to PyPI (CPU/MPS).
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }
